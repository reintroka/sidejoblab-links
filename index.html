<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>부업실험실</title>
<style>
  :root {
    --bg-top: #ff8a4c;
    --bg-bottom: #ff5f2e;
    --card-bg: #ffffff;
    --card-border: #f0ded4;
    --text-main: #2a1a12;
    --text-sub: #8a7267;
    --accent: #eb5a24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    min-height: 100vh;
    color: var(--text-main);
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 20px 56px;
  }
  .profile {
    text-align: center;
    margin-bottom: 22px;
  }
  .avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    margin: 0 auto 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  }
  .profile h1 {
    color: #fff;
    font-size: 21px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .profile p {
    color: rgba(255,255,255,0.92);
    font-size: 13.5px;
    line-height: 1.55;
    margin: 0 0 4px;
    white-space: pre-line;
  }
  .profile a.handle {
    color: #fff;
    font-size: 13px;
    text-decoration: underline;
    opacity: 0.85;
  }

  /* 검색 */
  .search-box {
    position: relative;
    margin-bottom: 18px;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    border-radius: 14px;
    border: none;
    background: rgba(255,255,255,0.92);
    font-size: 14px;
    color: var(--text-main);
    outline: none;
    box-shadow: 0 4px 14px rgba(80, 30, 10, 0.1);
  }
  .search-box input::placeholder { color: var(--text-sub); }
  .search-box .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.55;
    pointer-events: none;
  }
  .search-meta {
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    margin: 0 2px 12px;
    min-height: 16px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 12px 16px;
    text-decoration: none;
    color: var(--text-main);
    box-shadow: 0 4px 14px rgba(80, 30, 10, 0.08);
    transition: transform 0.12s ease;
  }
  .card:active { transform: scale(0.985); }
  .card.pinned {
    border: 1.5px solid var(--accent);
    background: linear-gradient(135deg, #fff7f2, #ffffff);
  }
  .thumb {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: #f5eee9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    overflow: hidden;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-body {
    min-width: 0;
    flex: 1 1 auto;
  }
  .tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .tag.pin { background: var(--accent); color: #fff; }
  .tag.num { background: #f3e9e3; color: var(--text-sub); }
  .title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 13px;
    color: var(--text-sub);
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .price {
    color: var(--accent);
    font-weight: 700;
  }

  .empty {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 13.5px;
    padding: 28px 0;
  }

  .more-btn {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 13px;
    border: none;
    border-radius: 14px;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .more-btn:active { background: rgba(255,255,255,0.28); }

  footer {
    margin-top: 30px;
    text-align: center;
  }
  .disclosure {
    color: rgba(255,255,255,0.82);
    font-size: 11.5px;
    line-height: 1.6;
    margin: 0 0 6px;
  }
  .credit {
    color: rgba(255,255,255,0.55);
    font-size: 10.5px;
  }
</style>
</head>

      title: "LG전자 퓨리케어 360도 Hit 공",
      sub: "요즘 미세먼지 너무 심하죠? 우리집 공기를 싹 바꿔줄 역대급 공기청정기 가져왔어요!", price: "357,710원대" },
    { rank: 9, url: "https://link.coupang.com/a/gyvrJYOpFc",
      title: "베이직스 2026 베이직북 16 프로",
      sub: "백만 원대 노트북 찾으시나요? 이거 하나면 끝납니다!", price: "1,071,600원대" },
    { rank: 8, url: "https://link.coupang.com/a/gx1QQkyzmv",
      title: "LG전자 퓨리케어 360도 오브제컬렉",
      sub: "미세먼지 지옥에서 살아남는 꿀템! 이거 하나면 끝나요.", price: "722,650원대" },
    { rank: 7, url: "https://link.coupang.com/a/gw5TDB2QzQ",
      title: "레노버 Idea Tab Plus 12.1",
      sub: "삼십만원대 역대급 가성비 태블릿", price: "369,000원대" },
    { rank: 6, url: "https://link.coupang.com/re/AFFSDP?lptag=AF2817003&pageKey=9608130050&itemId=28684284346&vendorItemId=95625818567",
      title: "LG 그램15 (코어i5·16GB·512GB)",
      sub: "무게 하나로 후기 폭발", price: "898,000원대" },
    { rank: 5, url: "https://link.coupang.com/a/gpHs3UKWwm",
      title: "크록스 비아 클로그 샌들",
      sub: "정가 79,900원 → 73%할인", price: "20,800원" },
    { rank: 4, url: "https://link.coupang.com/a/gnThd6IyDQ",
      title: "도미나스 다크스팟 커렉팅 골드 크림 45g",
      sub: "정가 58,000원 → 60%할인", price: "23,000원" },
    { rank: 3, url: "https://link.coupang.com/a/glMaQcH2rY",
      title: "스탠리 카페 투고 트래블 머그 473ml",
      sub: "정가 42,000원 → 58%할인", price: "17,550원" },
    { rank: 2, url: "https://link.coupang.com/a/gkpAnV8IuW",
      title: "창신리빙 스카이락 밀폐 반찬용기 12종 세트",
      sub: "73%할인", price: "8,900원" },
  ];

  // 실제 image가 없는 카드에 붙일 키워드 기반 이모지 폴백.
  const ICON_RULES = [
    [/자소서|프롬프트|이력서/, "📝"],
    [/청소|집안굿/, "🧽"],
    [/커피|에스프레소/, "☕"],
    [/전자레인지|주방|수납/, "🍳"],
    [/맥북|노트북|그램|베이직북|아이디어탭|태블릿/, "💻"],
    [/가르시니아|다이어트/, "💊"],
    [/퓨리케어|공기청정/, "🌬️"],
    [/크록스|샌들/, "👟"],
    [/크림|다크스팟/, "🧴"],
    [/머그|텀블러/, "🥤"],
    [/반찬용기|밀폐/, "🍱"],
  ];
  function fallbackIcon(item) {
    const text = item.title + " " + item.sub;
    for (const [re, emoji] of ICON_RULES) if (re.test(text)) return emoji;
    return "🛍️";
  }

  const PAGE_SIZE = 8; // 첫 화면엔 고정 카드 + 최신 8개만, 나머지는 "더보기"로
  let visibleCount = PAGE_SIZE;

  const listEl = document.getElementById("list");
  const moreBtn = document.getElementById("moreBtn");
  const emptyEl = document.getElementById("empty");
  const metaEl = document.getElementById("searchMeta");
  const searchEl = document.getElementById("search");

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function cardHtml(item) {
    const thumb = item.image
      ? `<img src="${escapeHtml(item.image)}" alt="" loading="lazy" />`
      : fallbackIcon(item);
    const tag = item.pinned
      ? `<span class="tag pin">📌 첫 실험</span>`
      : `<span class="tag num">${item.rank}번째 실험</span>`;
    return `
      <a class="card${item.pinned ? " pinned" : ""}" href="${escapeHtml(item.url)}" target="_blank" rel="noopener sponsored">
        <span class="thumb">${thumb}</span>
        <span class="card-body">
          ${tag}
          <p class="title">${escapeHtml(item.title)}</p>
          <p class="sub">${escapeHtml(item.sub)} ${item.price ? `<span class="price">${escapeHtml(item.price)}</span>` : ""}</p>
        </span>
      </a>`;
  }

  // 2026-09-10: 릴스 캡션/화면 배지에 "No.37" 식으로 순번을 홍보하기 시작하면서,
  // 시청자가 나중에 그 번호로 이 페이지에서 찾아올 수 있어야 한다(사용자 요청). 기존엔
  // title+sub 텍스트만 봐서 숫자를 넣어도 못 찾았음 — rank 정확 일치를 OR로 추가.
  function matchesQuery(item, q) {
    if ((item.title + " " + item.sub).toLowerCase().includes(q)) return true;
    if (/^\d+$/.test(q) && String(item.rank) === q) return true;
    return false;
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const pinned = ITEMS.filter((i) => i.pinned);
    const rest = ITEMS.filter((i) => !i.pinned);

    rest.sort((a, b) => b.rank - a.rank); // 배열 삽입 순서에 의존하지 않고 항상 최신순

    let filteredRest = rest;
    let searching = q.length > 0;
    if (searching) {
      filteredRest = rest.filter((i) => matchesQuery(i, q));
    }

    const shown = searching ? filteredRest : filteredRest.slice(0, visibleCount);
    const pinnedShown = searching
      ? pinned.filter((i) => matchesQuery(i, q))
      : pinned;

    const all = [...pinnedShown, ...shown];
    listEl.innerHTML = all.map(cardHtml).join("");

    emptyEl.style.display = all.length === 0 ? "block" : "none";

    if (searching) {
      metaEl.textContent = `"${searchEl.value.trim()}" 검색결과 ${all.length}개`;
      moreBtn.style.display = "none";
    } else {
      metaEl.textContent = "";
      const remaining = filteredRest.length - shown.length;
      if (remaining > 0) {
        moreBtn.style.display = "block";
        moreBtn.textContent = `이전 실험 더보기 (${remaining}개 남음)`;
      } else {
        moreBtn.style.display = "none";
      }
    }
  }

  moreBtn.addEventListener("click", () => {
    visibleCount += PAGE_SIZE;
    render();
  });
  searchEl.addEventListener("input", () => render());

  render();
</script>
